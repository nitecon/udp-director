# Example: Complete setup for routing to pods in a standard Kubernetes deployment
# This example shows how to deploy a game server and configure UDP Director to route to it

---
# 1. Create the namespace
apiVersion: v1
kind: Namespace
metadata:
  name: game-servers

---
# 2. Deploy the game server application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-game-server-deployment
  namespace: game-servers
  labels:
    app: demo-game-server
    map: tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-game-server
  template:
    metadata:
      labels:
        app: demo-game-server
        map: tutorial
    spec:
      containers:
        - name: demo-game-server
          image: registry.example.com/games/demo-server:latest
          env:
            - name: MAP
              value: "tutorial"
          ports:
            - name: game-udp
              containerPort: 7777
              protocol: UDP
            - name: game-tcp
              containerPort: 7777
              protocol: TCP
          volumeMounts:
            - name: mtls-cert
              mountPath: /etc/certs
              readOnly: true
      volumes:
        - name: mtls-cert
          secret:
            secretName: server-mtls-cert

---
# 3. Optional: Create a LoadBalancer service for external access
# Note: UDP Director can route directly to pods, bypassing this service
apiVersion: v1
kind: Service
metadata:
  name: demo-game-server-service
  namespace: game-servers
  labels:
    app: demo-game-server
spec:
  type: LoadBalancer
  selector:
    app: demo-game-server
  ports:
    - name: game-udp
      port: 7777
      targetPort: 7777
      protocol: UDP
    - name: game-tcp
      port: 7777
      targetPort: 7777
      protocol: TCP

---
# 4. Deploy UDP Director with pod-based routing
# First, apply the RBAC configuration (required for pod access)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: udp-director
  namespace: game-servers

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: udp-director-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agones.dev"]
    resources: ["gameservers"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: udp-director-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: udp-director-role
subjects:
  - kind: ServiceAccount
    name: udp-director
    namespace: game-servers

---
# 5. Apply the pod-based ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: udp-director-config
  namespace: game-servers
data:
  config.yaml: |
    queryPort: 9000
    dataPort: 7777
    sessionTimeoutSeconds: 300

    # Default endpoint targets pods with specific labels
    defaultEndpoint:
      resourceType: "game-server-pod"
      namespace: "game-servers"
      labelSelector:
        app: "demo-game-server"
        map: "tutorial"
      statusQuery:
        jsonPath: "status.phase"
        expectedValues:
          - "Running"

    resourceQueryMapping:
      game-server-pod:
        group: ""
        version: "v1"
        resource: "pods"
        addressPath: "status.podIP"
        portName: "game-udp"

---
# 6. Deploy UDP Director
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-director
  namespace: game-servers
  labels:
    app: udp-director
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udp-director
  template:
    metadata:
      labels:
        app: udp-director
    spec:
      serviceAccountName: udp-director
      containers:
        - name: udp-director
          image: your-registry/udp-director:latest
          ports:
            - name: query
              containerPort: 9000
              protocol: TCP
            - name: data
              containerPort: 7777
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/udp-director
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: udp-director-config

---
# 7. Expose UDP Director with a LoadBalancer service
apiVersion: v1
kind: Service
metadata:
  name: udp-director-service
  namespace: game-servers
spec:
  type: LoadBalancer
  selector:
    app: udp-director
  ports:
    - name: query
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: data
      port: 7777
      targetPort: 7777
      protocol: UDP

---
# Usage Instructions:
#
# 1. Deploy everything:
#    kubectl apply -f example-pod-deployment.yaml
#
# 2. Get the UDP Director service external IP:
#    kubectl get svc udp-director-service -n game-servers
#
# 3. Query for available pods:
#    # Connect to the query port (9000) and send a JSON query:
#    echo '{"resourceType":"game-server-pod","namespace":"game-servers","labelSelector":{"app":"demo-game-server"}}' | nc <EXTERNAL-IP> 9000
#
#
#
# Advanced Queries:
#
# - Target pods by map label:
#   {"resourceType":"game-server-pod","namespace":"game-servers","labelSelector":{"map":"tutorial"}}
#
# - Target TCP port instead of UDP:
#   {"resourceType":"game-server-pod-tcp","namespace":"game-servers","labelSelector":{"app":"demo-game-server"}}
#   (requires adding game-server-pod-tcp to resourceQueryMapping with portName: "game-tcp")
#
# Monitoring:
#
# - Check pod status:
#   kubectl get pods -n game-servers -l app=demo-game-server
#
# - View UDP Director logs:
#   kubectl logs -n game-servers -l app=udp-director -f
#
# - Describe a pod to see its IP and ports:
#   kubectl describe pod -n game-servers <pod-name>
