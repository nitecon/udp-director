apiVersion: v1
kind: ConfigMap
metadata:
  name: udp-director-config
  namespace: game-servers
data:
  config.yaml: |
    # UDP Director Configuration - Single Port Pod Routing
    # Simple single-port routing with label and annotation filtering
    
    queryPort: 9000
    dataPort: 7777
    sessionTimeoutSeconds: 300

    # Default endpoint - targets pods with specific labels
    defaultEndpoint:
      resourceType: "game-server-pod"
      namespace: "game-servers"
      
      # Labels: Static configuration (server-side filtering)
      labelSelector:
        app: "demo-game-server"
        map: "tutorial"
      
      # Annotations: Dynamic operational data (client-side filtering)
      # Uncomment to filter by dynamic values
      # annotationSelector:
      #   currentLoad: "medium"
      #   healthStatus: "healthy"
      
      statusQuery:
        jsonPath: "status.phase"
        expectedValues:
          - "Running"

    # Resource query mapping for direct pod access
    resourceQueryMapping:
      game-server-pod:
        group: ""
        version: "v1"
        resource: "pods"
        addressPath: "status.podIP"
        # Look up port by name (recommended approach)
        portName: "game-udp"
