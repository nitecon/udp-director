# Regional TCP query and UDP forwarding configuration.
queryPort: 9000
mapLabel: map
maxCharactersPerServer: 128
dataPort: 7777
sessionTimeoutSeconds: 300
characterLabelPrefix: characters.udp-director.io
disconnectAnnotation: udp-director.io/disconnected-at

# Optional: signal aggregate demand when a map has no eligible server capacity.
# The director waits for Ready Pods; the controller owns starting capacity.
# capacityDemand:
#   endpoint: http://capacity-controller.control.svc:8080/v1alpha1/demand
#   bootTimeoutSeconds: 300
#   backendGroups:
#     tutorial: example-backend

defaultEndpoint:
  resourceType: pod
  namespace: game-servers
  labelSelector:
    app: game-server

resourceQueryMapping:
  pod:
    group: ""
    version: v1
    resource: pods
    addressPath: status.podIP
    portName: game
